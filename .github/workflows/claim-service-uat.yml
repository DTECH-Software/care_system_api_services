name: Claim Service CI/CD (UAT)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "claim-service/**"
      - ".github/workflows/claim-service-uat.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build Claim Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claim-service
    env:
      SPRING_PROFILES_ACTIVE: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build Jar
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=uat

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: claim-service-jar
          path: claim-service/target/*.jar
          if-no-files-found: error

  cd:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: claim-service-jar
          path: ./artifact

      - name: Deploy Jar to UAT via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.UAT_DEPLOY_DIR }}"

      - name: Copy Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}"
          overwrite: true

      - name: Restart Claim Service in UAT
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.UAT_DEPLOY_DIR }}"
            cd "$DEPLOY_DIR"

            LATEST_JAR="$(ls -t *.jar | head -n 1)"
            if [ -z "$LATEST_JAR" ]; then
              echo "No jar found in $DEPLOY_DIR"
              exit 1
            fi

            # Stop old process if running
            pkill -f "java -jar .*(claim-service|claim_service).*" || true
            sleep 2

            # Always enforce UAT profile
            nohup java -jar "$DEPLOY_DIR/$LATEST_JAR" --spring.profiles.active=uat > "$DEPLOY_DIR/claim-service.log" 2>&1 &
            echo "Started $LATEST_JAR with profile=uat"
