name: All Services CI/CD (UAT)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "auth-service/**"
      - "claim-service/**"
      - "cloud-service/**"
      - "document-service/**"
      - "login-service/**"
      - "message-service/**"
      - "notification-service/**"
      - "registry-service/**"
      - "token-service/**"
      - ".github/workflows/main-uat.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - claim-service
          - cloud-service
          - document-service
          - login-service
          - message-service
          - notification-service
          - registry-service
          - token-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          SPRING_PROFILES_ACTIVE: uat
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=uat

      - name: Upload ${{ matrix.service }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  cd:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - claim-service
          - cloud-service
          - document-service
          - login-service
          - message-service
          - notification-service
          - registry-service
          - token-service
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    steps:
      - name: Download ${{ matrix.service }} Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./artifact/${{ matrix.service }}

      - name: Ensure Deploy Directory (UAT)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.UAT_DEPLOY_DIR }}/${{ matrix.service }}"

      - name: Copy ${{ matrix.service }} Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/${{ matrix.service }}/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/${{ matrix.service }}"
          overwrite: true

      - name: Restart ${{ matrix.service }} in UAT
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            SERVICE="${{ matrix.service }}"
            SERVICE_UNDERSCORE="${SERVICE//-/_}"
            DEPLOY_DIR="${{ secrets.UAT_DEPLOY_DIR }}/${{ matrix.service }}"
            cd "$DEPLOY_DIR"

            LATEST_JAR="$(ls -t *.jar | head -n 1)"
            if [ -z "$LATEST_JAR" ]; then
              echo "No jar found in $DEPLOY_DIR"
              exit 1
            fi

            # Stop old process if running
            pkill -f "java -jar .*(${SERVICE}|${SERVICE_UNDERSCORE}).*" || true
            sleep 2

            # Always enforce UAT profile
            nohup java -jar "$DEPLOY_DIR/$LATEST_JAR" --spring.profiles.active=uat > "$DEPLOY_DIR/${SERVICE}.log" 2>&1 &
            echo "Started ${SERVICE} using $LATEST_JAR with profile=uat"
