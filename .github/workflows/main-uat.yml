name: All Services CI/CD (UAT)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "auth-service/**"
      - "claim-service/**"
      - "cloud-service/**"
      - "document-service/**"
      - "login-service/**"
      - "message-service/**"
      - "notification-service/**"
      - "registry-service/**"
      - "token-service/**"
      - "docker-compose-uat.yml"
      - ".github/workflows/main-uat.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy. Use all for full deployment."
        required: true
        default: "all"
        type: choice
        options:
          - all
          - auth-service
          - claim-service
          - cloud-service
          - document-service
          - login-service
          - message-service
          - notification-service
          - registry-service
          - token-service

env:
  ALL_SERVICES: registry-service token-service message-service document-service notification-service auth-service login-service claim-service cloud-service

jobs:
  detect:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          all_services="${ALL_SERVICES}"
          selected_services=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested="${{ github.event.inputs.service }}"
            if [ "$requested" = "all" ]; then
              selected_services="$all_services"
            else
              selected_services="$requested"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            if [ -z "$before" ] || echo "$before" | grep -Eq '^0+$'; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$after")"
            else
              changed_files="$(git diff --name-only "$before" "$after")"
            fi

            echo "Changed files:"
            echo "$changed_files"

            if echo "$changed_files" | grep -Eq '^(docker-compose-uat\.yml|\.github/workflows/main-uat\.yml)$'; then
              selected_services="$all_services"
            else
              for service in $all_services; do
                if echo "$changed_files" | grep -q "^${service}/"; then
                  selected_services="${selected_services} ${service}"
                fi
              done
            fi
          fi

          selected_services="$(echo "$selected_services" | xargs)"
          if [ -z "$selected_services" ]; then
            echo "No deployable service changes detected."
            echo 'matrix={"service":[]}' >> "$GITHUB_OUTPUT"
            echo "services=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json_items="$(printf '%s\n' $selected_services | jq -R . | jq -sc .)"
          echo "Deploy services: $selected_services"
          echo "matrix={\"service\":${json_items}}" >> "$GITHUB_OUTPUT"
          echo "services=$selected_services" >> "$GITHUB_OUTPUT"

  ci:
    name: Build Changed Services
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.services != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          SPRING_PROFILES_ACTIVE: uat
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=uat

      - name: Upload ${{ matrix.service }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  cd:
    name: Deploy Changed Services to UAT
    runs-on: ubuntu-latest
    needs: [ detect, ci ]
    if: needs.detect.outputs.services != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download changed service artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-jar"
          path: ./artifact

      - name: Prepare deploy package
        shell: bash
        run: |
          set -euo pipefail
          services="${{ needs.detect.outputs.services }}"
          rm -rf upload
          mkdir -p upload
          cp docker-compose-uat.yml upload/docker-compose-uat.yml
          for service in $services; do
            mkdir -p "upload/${service}/target"
            cp "artifact/${service}-jar/"*.jar "upload/${service}/target/"
            cp "${service}/Dockerfile" "upload/${service}/Dockerfile"
          done

      - name: Copy changed files to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "upload/**"
          target: "${{ secrets.UAT_DEPLOY_DIR }}"
          strip_components: 1
          overwrite: true

      - name: Restart changed services in UAT order
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHANGED_SERVICES: ${{ needs.detect.outputs.services }}
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          envs: CHANGED_SERVICES
          script: |
            set -e
            DEPLOY_BASE="${{ secrets.UAT_DEPLOY_DIR }}"
            COMPOSE_FILE="${DEPLOY_BASE}/docker-compose-uat.yml"

            should_deploy() {
              service="$1"
              echo " $CHANGED_SERVICES " | grep -q " $service "
            }

            wait_for_http() {
              url="$1"
              name="$2"
              attempts="${3:-36}"
              sleep_seconds="${4:-5}"
              for attempt in $(seq 1 "$attempts"); do
                if curl -sS --max-time 3 -o /dev/null "$url"; then
                  echo "$name is responding at $url"
                  return 0
                fi
                echo "Waiting for $name ($attempt/$attempts): $url"
                sleep "$sleep_seconds"
              done
              echo "$name did not become ready: $url"
              return 1
            }

            wait_for_eureka_service() {
              service_name="$1"
              attempts="${2:-36}"
              for attempt in $(seq 1 "$attempts"); do
                if curl -fsS --max-time 3 "http://127.0.0.1:8081/eureka/apps/${service_name}" >/dev/null; then
                  echo "$service_name is registered in Eureka"
                  return 0
                fi
                echo "Waiting for Eureka registration of $service_name ($attempt/$attempts)"
                sleep 5
              done
              echo "$service_name did not register in Eureka"
              return 1
            }

            stop_old_java_service() {
              service="$1"
              deploy_dir="${DEPLOY_BASE}/${service}"
              pid_file="${deploy_dir}/${service}.pid"
              if [ -f "$pid_file" ]; then
                old_pid="$(cat "$pid_file" 2>/dev/null || true)"
                if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
                  old_cmd="$(ps -p "$old_pid" -o args= 2>/dev/null || true)"
                  if echo "$old_cmd" | grep -Eq "java .*\.jar"; then
                    echo "Stopping old java process for $service: $old_pid"
                    kill "$old_pid" || true
                    sleep 5
                  else
                    echo "Skipping stale pid file for $service: $old_pid is not a java jar process"
                  fi
                fi
                rm -f "$pid_file"
              fi
              pgrep -f "java .*${deploy_dir}/.*\.jar" | while read -r pid; do
                if [ "$pid" != "$$" ]; then
                  echo "Stopping matching java process for $service: $pid"
                  kill "$pid" || true
                fi
              done || true
              pgrep -f "java .*${service}-0.0.1.jar" | while read -r pid; do
                if [ "$pid" != "$$" ]; then
                  echo "Stopping matching jar process for $service: $pid"
                  kill "$pid" || true
                fi
              done || true
            }

            compose_up_service() {
              service="$1"
              port="$2"
              eureka_name="$3"

              if ! should_deploy "$service"; then
                echo "Skipping unchanged service: $service"
                return 0
              fi

              stop_old_java_service "$service"
              docker compose -f "$COMPOSE_FILE" up -d --build "$service"
              wait_for_http "http://127.0.0.1:${port}" "$service"
              if [ -n "$eureka_name" ]; then
                wait_for_eureka_service "$eureka_name"
              fi
            }

            docker --version
            docker compose version
            cd "$DEPLOY_BASE"

            compose_up_service "registry-service" "8081" ""
            if should_deploy "registry-service"; then
              wait_for_http "http://127.0.0.1:8081/eureka/apps" "registry-service"
            fi

            compose_up_service "token-service" "8082" "TOKEN-SERVICE"
            compose_up_service "message-service" "8084" "MESSAGE-SERVICE"
            compose_up_service "document-service" "8086" "DOCUMENT-SERVICE"
            compose_up_service "notification-service" "8088" "NOTIFICATION-SERVICE"
            compose_up_service "auth-service" "8085" "AUTH-SERVICE"
            compose_up_service "login-service" "8083" "LOGIN-SERVICE"
            compose_up_service "claim-service" "8087" "CLAIM-SERVICE"
            compose_up_service "cloud-service" "8080" "CLOUD-SERVICE"

            docker compose -f "$COMPOSE_FILE" ps
