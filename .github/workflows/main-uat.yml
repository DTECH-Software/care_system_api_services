name: All Services CI/CD (UAT)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - "auth-service/**"
      - "claim-service/**"
      - "cloud-service/**"
      - "document-service/**"
      - "login-service/**"
      - "message-service/**"
      - "notification-service/**"
      - "registry-service/**"
      - "token-service/**"
      - "docker-compose-uat.yml"
      - ".github/workflows/main-uat.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - claim-service
          - cloud-service
          - document-service
          - login-service
          - message-service
          - notification-service
          - registry-service
          - token-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          SPRING_PROFILES_ACTIVE: uat
        run: mvn -B -DskipTests clean package -Dspring.profiles.active=uat

      - name: Upload ${{ matrix.service }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          if-no-files-found: error

  cd:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download registry-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: registry-service-jar
          path: ./artifact/registry-service

      - name: Download token-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: token-service-jar
          path: ./artifact/token-service

      - name: Download message-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: message-service-jar
          path: ./artifact/message-service

      - name: Download document-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: document-service-jar
          path: ./artifact/document-service

      - name: Download notification-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: notification-service-jar
          path: ./artifact/notification-service

      - name: Download auth-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: ./artifact/auth-service

      - name: Download login-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: login-service-jar
          path: ./artifact/login-service

      - name: Download claim-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: claim-service-jar
          path: ./artifact/claim-service

      - name: Download cloud-service Artifact
        uses: actions/download-artifact@v4
        with:
          name: cloud-service-jar
          path: ./artifact/cloud-service

      - name: Ensure Deploy Directories (UAT)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            DEPLOY_BASE="${{ secrets.UAT_DEPLOY_DIR }}"
            for service in registry-service token-service message-service document-service notification-service auth-service login-service claim-service cloud-service; do
              rm -rf "${DEPLOY_BASE}/${service}/target"
              mkdir -p "${DEPLOY_BASE}/${service}/target"
            done

      - name: Copy registry-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/registry-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/registry-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy token-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/token-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/token-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy message-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/message-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/message-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy document-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/document-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/document-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy notification-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/notification-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/notification-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy auth-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/auth-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/auth-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy login-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/login-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/login-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy claim-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/claim-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/claim-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy cloud-service Jar to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "./artifact/cloud-service/*.jar"
          target: "${{ secrets.UAT_DEPLOY_DIR }}/cloud-service/target"
          strip_components: 2
          overwrite: true

      - name: Copy Docker Compose Files to UAT
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          source: "docker-compose-uat.yml,registry-service/Dockerfile,token-service/Dockerfile,message-service/Dockerfile,document-service/Dockerfile,notification-service/Dockerfile,auth-service/Dockerfile,login-service/Dockerfile,claim-service/Dockerfile,cloud-service/Dockerfile"
          target: "${{ secrets.UAT_DEPLOY_DIR }}"
          overwrite: true

      - name: Restart Services in UAT Order
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USER }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            DEPLOY_BASE="${{ secrets.UAT_DEPLOY_DIR }}"
            COMPOSE_FILE="${DEPLOY_BASE}/docker-compose-uat.yml"

            wait_for_http() {
              url="$1"
              name="$2"
              attempts="${3:-36}"
              sleep_seconds="${4:-5}"
              for attempt in $(seq 1 "$attempts"); do
                if curl -sS --max-time 3 -o /dev/null "$url"; then
                  echo "$name is responding at $url"
                  return 0
                fi
                echo "Waiting for $name ($attempt/$attempts): $url"
                sleep "$sleep_seconds"
              done
              echo "$name did not become ready: $url"
              return 1
            }

            wait_for_eureka_service() {
              service_name="$1"
              attempts="${2:-36}"
              for attempt in $(seq 1 "$attempts"); do
                if curl -fsS --max-time 3 "http://127.0.0.1:8081/eureka/apps/${service_name}" >/dev/null; then
                  echo "$service_name is registered in Eureka"
                  return 0
                fi
                echo "Waiting for Eureka registration of $service_name ($attempt/$attempts)"
                sleep 5
              done
              echo "$service_name did not register in Eureka"
              return 1
            }

            stop_old_java_service() {
              service="$1"
              deploy_dir="${DEPLOY_BASE}/${service}"
              pid_file="${deploy_dir}/${service}.pid"
              if [ -f "$pid_file" ]; then
                old_pid="$(cat "$pid_file" 2>/dev/null || true)"
                if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then
                  old_cmd="$(ps -p "$old_pid" -o args= 2>/dev/null || true)"
                  if echo "$old_cmd" | grep -Eq "java .*\.jar"; then
                    echo "Stopping old java process for $service: $old_pid"
                    kill "$old_pid" || true
                    sleep 5
                  else
                    echo "Skipping stale pid file for $service: $old_pid is not a java jar process"
                  fi
                fi
                rm -f "$pid_file"
              fi
              pgrep -f "java .*${deploy_dir}/.*\.jar" | while read -r pid; do
                if [ "$pid" != "$$" ]; then
                  echo "Stopping matching java process for $service: $pid"
                  kill "$pid" || true
                fi
              done || true
              pgrep -f "java .*${service}-0.0.1.jar" | while read -r pid; do
                if [ "$pid" != "$$" ]; then
                  echo "Stopping matching jar process for $service: $pid"
                  kill "$pid" || true
                fi
              done || true
            }

            compose_up_service() {
              service="$1"
              port="$2"
              eureka_name="$3"

              docker compose -f "$COMPOSE_FILE" up -d --build "$service"
              wait_for_http "http://127.0.0.1:${port}" "$service"
              if [ -n "$eureka_name" ]; then
                wait_for_eureka_service "$eureka_name"
              fi
            }

            docker --version
            docker compose version

            for service in registry-service token-service message-service document-service notification-service auth-service login-service claim-service cloud-service; do
              stop_old_java_service "$service"
            done
            sleep 3

            cd "$DEPLOY_BASE"

            compose_up_service "registry-service" "8081" ""
            wait_for_http "http://127.0.0.1:8081/eureka/apps" "registry-service"

            compose_up_service "token-service" "8082" "TOKEN-SERVICE"
            compose_up_service "message-service" "8084" "MESSAGE-SERVICE"
            compose_up_service "document-service" "8086" "DOCUMENT-SERVICE"
            compose_up_service "notification-service" "8088" "NOTIFICATION-SERVICE"
            compose_up_service "auth-service" "8085" "AUTH-SERVICE"
            compose_up_service "login-service" "8083" "LOGIN-SERVICE"
            compose_up_service "claim-service" "8087" "CLAIM-SERVICE"
            compose_up_service "cloud-service" "8080" "CLOUD-SERVICE"

            docker compose -f "$COMPOSE_FILE" ps
