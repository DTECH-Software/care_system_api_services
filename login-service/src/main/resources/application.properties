spring.application.name=login-service
server.port=8083
server.servlet.context-path=/login-service

# Production monitoring: expose health only and keep sensitive details hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Emit application logs to stdout for Docker log collection.
logging.level.root=INFO
logging.level.com.dtech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Colombo} %-5level [%thread] %logger{36} - %msg%n
spring.profiles.active=dev

#Eureka client
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8081/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.metadata-map.zone=default

#Database
spring.datasource.url=jdbc:mysql://45.79.125.85:3306/caresystem
spring.datasource.username=root
spring.datasource.password=@12Bdmin#!8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50

#HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=login-service-hikari

#Feign client
feign.api.key=dtehCare-api-1233@himal
otp.validity-seconds=${OTP_VALIDITY_SECONDS:300}
