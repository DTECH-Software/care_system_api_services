spring.application.name=cloud-service
server.port=8080

# Production monitoring: expose health only and keep sensitive details hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Emit application logs to stdout for Docker log collection.
logging.level.root=INFO
logging.level.com.dtech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Colombo} %-5level [%thread] %logger{36} - %msg%n
spring.profiles.active=dev

#Eureka client
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8081/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

spring.cloud.gateway.routes[0].id=login-service
spring.cloud.gateway.routes[0].uri=lb://login-service
spring.cloud.gateway.routes[0].predicates=Path=/login-service/**

spring.cloud.gateway.routes[1].id=token-service
spring.cloud.gateway.routes[1].uri=lb://token-service
spring.cloud.gateway.routes[1].predicates=Path=/token-service/**

spring.cloud.gateway.routes[2].id=message-service
spring.cloud.gateway.routes[2].uri=lb://message-service
spring.cloud.gateway.routes[2].predicates=Path=/message-service/**

spring.cloud.gateway.routes[3].id=auth-service
spring.cloud.gateway.routes[3].uri=lb://auth-service
spring.cloud.gateway.routes[3].predicates=Path=/auth-service/**

spring.cloud.gateway.routes[4].id=document-service
spring.cloud.gateway.routes[4].uri=lb://document-service
spring.cloud.gateway.routes[4].predicates=Path=/document-service/**

spring.cloud.gateway.routes[5].id=claim-service
spring.cloud.gateway.routes[5].uri=lb://claim-service
spring.cloud.gateway.routes[5].predicates=Path=/claim-service/**

spring.cloud.gateway.routes[6].id=notification-service
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates=Path=/notification-service/**

eureka.instance.metadata-map.zone=default

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600
