spring.application.name=document-service
server.port=8086
server.servlet.context-path=/document-service
spring.profiles.active=dev

#Eureka client
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8081/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.metadata-map.zone=default

#Database
spring.datasource.url=jdbc:mysql://localhost:3306/care_system
spring.datasource.username=root
spring.datasource.password=Himal@381
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50

#HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=document-service-hikari

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Feign client
feign.api.key=dtehCare-api-1233@himal
