spring.application.name=document-service
server.port=8086
server.servlet.context-path=/document-service

# Production monitoring: expose health only and keep sensitive details hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Emit application logs to stdout for Docker log collection.
logging.level.root=INFO
logging.level.com.dtech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Colombo} %-5level [%thread] %logger{36} - %msg%n
spring.profiles.active=dev

#Eureka client
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:8081/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.metadata-map.zone=default

#Database
spring.datasource.url=jdbc:mysql://45.79.125.85:3306/caresystem
spring.datasource.username=root
spring.datasource.password=@12Bdmin#!8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.tomcat.max-wait=10000
spring.datasource.tomcat.max-active=50

#HikariCP Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=document-service-hikari

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Feign client
feign.api.key=dtehCare-api-1233@himal

# Linode Object Storage (credentials are supplied through environment variables)
wecare.object-storage.enabled=${WECARE_OBJECT_STORAGE_ENABLED:false}
wecare.object-storage.app-write-enabled=${WECARE_APP_OBJECT_STORAGE_WRITE_ENABLED:false}
wecare.object-storage.retain-database-copy=${WECARE_OBJECT_STORAGE_RETAIN_DATABASE_COPY:false}
wecare.object-storage.endpoint=${LINODE_OBJECT_STORAGE_ENDPOINT:}
wecare.object-storage.signing-region=${LINODE_OBJECT_STORAGE_SIGNING_REGION:us-east-1}
wecare.object-storage.bucket=${LINODE_OBJECT_STORAGE_BUCKET:}
wecare.object-storage.access-key=${LINODE_OBJECT_STORAGE_ACCESS_KEY:}
wecare.object-storage.secret-key=${LINODE_OBJECT_STORAGE_SECRET_KEY:}
wecare.object-storage.app-prefix=${WECARE_APP_OBJECT_STORAGE_PREFIX:app}
