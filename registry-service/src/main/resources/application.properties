spring.application.name=registry-service
server.port=8081

# Production monitoring: expose health only and keep sensitive details hidden.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Emit application logs to stdout for Docker log collection.
logging.level.root=INFO
logging.level.com.dtech=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Colombo} %-5level [%thread] %logger{36} - %msg%n
spring.profiles.active=dev

# Eureka Server configuration
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=true
